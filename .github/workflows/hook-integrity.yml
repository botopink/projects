# hook-integrity — the meta repository's CI (00-gate, front 114 step 4).
#
# The meta repository holds no code: it pins the compiler and the libraries as
# submodules and keeps the planning documents. What can go wrong here is a
# pointer, a path or a guard — so one job, every check hard, on every push and
# pull request to `feat` and `main`:
#
#   1. every submodule pointer is an ancestor of (or equal to) its remote `feat`
#      — a bump never points at a commit that is not pushed;
#   2. every path the meta AGENTS.md § Layout table names exists on disk (the
#      first backticked path of each row, `{a,b}` expanded; a row the table
#      itself calls git-ignored is the plan file, not a layout path);
#   3. no `*.snap.new`, `*.snap.md.new` or `todo.md` is tracked, in the meta
#      repository or in any submodule;
#   4. the library repositories' pre-commit guards are one text: `pre-commit`,
#      `lib/runner-standalone.sh` and `scripts/gate.sh` (front 163 s7) byte-identical across rakun, query,
#      actions, http, log, routing, validation, css, snap, json, yaml and markdown
#      (113 step 5's check, made continuous; actions to validation since
#      decision 326, 03-bundled-libs/138's carve-out of 114's file; css since
#      decision 338, 08-bpp/119 step 1; snap since decision 391,
#      20-snap step 0; json, yaml and markdown since decision 396,
#      03-bundled-libs/142 step 0; rakun and query since front 165), each
#      `.gitignore` naming `*.snap.new` and `*.snap.md.new`, no
#      `scripts/known-broken-examples.txt`, and each AGENTS.md naming
#      `git config core.hooksPath scripts/git-hooks`, `scripts/gate.sh` and
#      `conformance/`;
#   5. `scripts/language-gap-markers.sh` (113 step 4c) exits 0 — every
#      `// LANGUAGE GAP` marker has a row in the milestone's language-gaps.md.
#
#   6. `scripts/decisions-split.py --check` exits 0 — every repository's generated
#      `decisions-taken.md` is what the script writes (decision 482);
#   7. `scripts/decision-cells.py check` exits 0 (front 166) — every
#      `conformance/modules/decisions-taken/<slug>/` is the `Cell` slug of a code-bearing ledger row of its
#      repository, with its docs.md and program in the generated shape; completeness
#      per repository once its list in the script names it.
#
# The seven checks are the meta repository's `scripts/gate.sh` (front 163 s7,
# decision 473): this workflow calls it, and `scripts/gate.sh` from the meta root
# runs the same checks locally. The same script is the machine's gate scheduler
# (`run`, `tasks`, `libs`, `status`); CI uses only its checks.
name: hook-integrity

on:
  push:
    branches: [feat, main]
  pull_request:
    branches: [feat, main]

concurrency:
  group: hook-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-integrity:
    name: submodule pointers, layout, tracked candidates, library guards, gap markers
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: scripts/gate.sh — the seven checks
        shell: bash
        run: bash scripts/gate.sh check
